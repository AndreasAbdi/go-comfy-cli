version: 1
aliases:
  input_image:
    selector: '.nodes[] | select(.id == 41) | .widgets_values[0]'
    type: string
    cardinality: one
  reference_image:
    selector: '.nodes[] | select(.id == 83) | .widgets_values[0]'
    type: string
    cardinality: one
  positive_prompt:
    selector: '.nodes[] | select(.id == 170) | .widgets_values[0]'
    type: string
    cardinality: one
  negative_prompt:
    selector: '.nodes[] | select(.id == 170) | .widgets_values[1]'
    type: string
    cardinality: one
  # Added for the Limbus prologue production run. The subgraph node (170)
  # exposes its promoted widgets positionally; index 7 is the KSampler seed.
  # Pinning it makes a re-roll a deliberate change rather than luck.
  seed:
    selector: '.nodes[] | select(.id == 170) | .widgets_values[7]'
    type: number
    cardinality: one
